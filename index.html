<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Base64 a PDF - Múltiple</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: system-ui, -apple-system, sans-serif; background: #f4f4f5; color: #18181b; display: flex; justify-content: center; padding: 24px; min-height: 100vh; }
  .card { background: #fff; width: 100%; max-width: 760px; border-radius: 12px; padding: 24px; box-shadow: 0 4px 20px rgba(0,0,0,.08); }
  h1 { font-size: 1.5rem; margin-bottom: 6px; }
  p.desc { color: #71717a; font-size: .9rem; margin-bottom: 16px; }
  .global-btns { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 18px; }
  .global-btns button { flex: 1; min-width: 140px; }
  button { border: none; border-radius: 8px; padding: 10px 16px; font-weight: 600; cursor: pointer; font-size: .85rem; }
  .btn-dark { background: #18181b; color: #fff; }
  .btn-dark:hover { background: #27272a; }
  .btn-light { background: #e4e4e7; color: #18181b; }
  .btn-light:hover { background: #d4d4d8; }
  .btn-outline { background: transparent; border: 1px solid #d4d4d8; }
  .btn-outline:hover { background: #f4f4f5; }
  .btn-danger { background: #fff; border: 1px solid #fecaca; color: #dc2626; padding: 6px 12px; font-size: .8rem; }
  .btn-danger:hover { background: #fef2f2; }

  #items { display: flex; flex-direction: column; gap: 16px; }
  .item { border: 1px solid #e4e4e7; border-radius: 10px; padding: 16px; background: #fafafa; }
  .item-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .item-title { font-weight: 700; font-size: .95rem; }
  .item-header-right { display: flex; gap: 8px; align-items: center; }
  .filename { border: 1px solid #d4d4d8; border-radius: 6px; padding: 6px 10px; font-size: .8rem; outline: none; width: 160px; }
  label { font-size: .8rem; font-weight: 600; display: block; margin-bottom: 6px; }
  textarea { width: 100%; min-height: 120px; border: 1px solid #d4d4d8; border-radius: 8px; padding: 10px; font-family: ui-monospace, monospace; font-size: .75rem; resize: vertical; outline: none; background: #fff; }
  textarea:focus, .filename:focus { border-color: #18181b; }
  .btns { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
  .btns button { flex: 1; min-width: 100px; }
  .btn-download { display: none; }
  .msg { margin-top: 8px; font-size: .8rem; min-height: 1.2em; }
  .error { color: #dc2626; }
  .ok { color: #16a34a; }
  iframe { width: 100%; height: 400px; border: 1px solid #e4e4e7; border-radius: 8px; margin-top: 10px; display: none; background: #fff; }
</style>
</head>
<body>
<div class="card">
  <h1>Base64 a PDF</h1>
  <p class="desc">Agrega todos los códigos Base64 que necesites. Cada uno se convierte y descarga de forma independiente. Todo funciona en tu navegador.</p>

  <div class="global-btns">
    <button id="btnAgregar" class="btn-outline">+ Agregar otro Base64</button>
    <button id="btnConvertirTodos" class="btn-dark">Convertir todos</button>
    <button id="btnDescargarTodos" class="btn-light">Descargar todos</button>
  </div>

  <div id="items"></div>
</div>

<template id="tpl-item">
  <div class="item">
    <div class="item-header">
      <span class="item-title"></span>
      <div class="item-header-right">
        <input class="filename" placeholder="nombre.pdf" />
        <button class="btn-danger btn-eliminar" title="Eliminar">✕ Eliminar</button>
      </div>
    </div>
    <label>Código Base64</label>
    <textarea placeholder="JVBERi0xLjQKJeLjz9MK...  o  data:application/pdf;base64,JVBERi..."></textarea>
    <div class="btns">
      <button class="btn-dark btn-convertir">Convertir a PDF</button>
      <button class="btn-light btn-download">Descargar PDF</button>
      <button class="btn-outline btn-limpiar">Limpiar</button>
    </div>
    <div class="msg"></div>
    <iframe title="Vista previa PDF"></iframe>
  </div>
</template>

<script>
const $items = document.getElementById('items');
const $tpl = document.getElementById('tpl-item');
let contador = 0;

async function base64ToBlobChunked(base64, onProgress) {
  const clean = base64.trim().replace(/\s/g, '').replace(/^data:.*;base64,/, '');
  if (!clean) throw new Error('El campo está vacío.');
  if (clean.length % 4 !== 0) throw new Error('Base64 no válido (longitud no múltiplo de 4).');
  // validación rápida sin regex gigante: si contiene caracteres fuera de base64, falla atob igual
  const padding = clean.endsWith('==') ? 2 : clean.endsWith('=') ? 1 : 0;
  const decodedLen = (clean.length * 3) / 4 - padding;
  const bytes = new Uint8Array(decodedLen);
  const chunkSize = 32768; // múltiplo de 4, ~24KB decodificados por chunk
  let offset = 0;
  for (let i = 0; i < clean.length; i += chunkSize) {
    const chunk = clean.slice(i, i + chunkSize);
    // atob es síncrono pero por chunk es mucho más rápido y no bloquea 10s seguidos
    let binary;
    try { binary = atob(chunk); } catch { throw new Error('Base64 no válido (caracteres inválidos).'); }
    for (let j = 0; j < binary.length; j++) bytes[offset++] = binary.charCodeAt(j);
    if (onProgress) onProgress(Math.min(i + chunkSize, clean.length), clean.length);
    // ceder al event loop cada ~8 chunks para no congelar UI/preview
    if (i % (chunkSize * 8) === 0) await new Promise(r => setTimeout(r, 0));
  }
  return new Blob([bytes], { type: 'application/pdf' });
}

function crearItem() {
  contador++;
  const clone = $tpl.content.cloneNode(true);
  const $item = clone.querySelector('.item');
  const $title = $item.querySelector('.item-title');
  const $filename = $item.querySelector('.filename');
  const $textarea = $item.querySelector('textarea');
  const $btnConvertir = $item.querySelector('.btn-convertir');
  const $btnDescargar = $item.querySelector('.btn-download');
  const $btnLimpiar = $item.querySelector('.btn-limpiar');
  const $btnEliminar = $item.querySelector('.btn-eliminar');
  const $msg = $item.querySelector('.msg');
  const $preview = $item.querySelector('iframe');

  $title.textContent = 'PDF #' + contador;
  $filename.value = 'documento-' + contador + '.pdf';
  let pdfUrl = null;

  function setMsg(text, type) {
    $msg.textContent = text;
    $msg.className = 'msg ' + (type || '');
  }

  async function convertir() {
    $btnConvertir.disabled = true;
    $btnConvertir.textContent = 'Convirtiendo...';
    setMsg('Decodificando...', '');
    try {
      if (pdfUrl) URL.revokeObjectURL(pdfUrl);
      const blob = await base64ToBlobChunked($textarea.value, (done, total) => {
        const pct = Math.round((done / total) * 100);
        setMsg(`Decodificando ${pct}%...`, '');
      });
      pdfUrl = URL.createObjectURL(blob);
      $preview.src = pdfUrl;
      $preview.style.display = 'block';
      $btnDescargar.style.display = 'inline-block';
      setMsg('PDF generado correctamente.', 'ok');
      return true;
    } catch (e) {
      setMsg(e.message, 'error');
      $preview.style.display = 'none';
      $btnDescargar.style.display = 'none';
      return false;
    } finally {
      $btnConvertir.disabled = false;
      $btnConvertir.textContent = 'Convertir a PDF';
    }
  }

  async function descargar() {
    if (!pdfUrl) {
      const ok = await convertir();
      if (!ok) return;
    }
    const a = document.createElement('a');
    a.href = pdfUrl;
    let name = $filename.value.trim() || 'documento.pdf';
    if (!name.toLowerCase().endsWith('.pdf')) name += '.pdf';
    a.download = name;
    a.click();
  }

  $btnConvertir.addEventListener('click', convertir);
  $btnDescargar.addEventListener('click', descargar);
  $btnLimpiar.addEventListener('click', () => {
    $textarea.value = '';
    setMsg('', '');
    $preview.style.display = 'none';
    $preview.src = '';
    $btnDescargar.style.display = 'none';
    if (pdfUrl) { URL.revokeObjectURL(pdfUrl); pdfUrl = null; }
  });
  $btnEliminar.addEventListener('click', () => {
    if (pdfUrl) URL.revokeObjectURL(pdfUrl);
    $item.remove();
    if ($items.children.length === 0) crearItem();
  });

  // exponer para acciones globales
  $item._convertir = convertir;
  $item._descargar = descargar;

  $items.appendChild($item);
}

// acciones globales
document.getElementById('btnAgregar').addEventListener('click', crearItem);
document.getElementById('btnConvertirTodos').addEventListener('click', async () => {
  for (const el of [...$items.children]) if (el._convertir) await el._convertir();
});
document.getElementById('btnDescargarTodos').addEventListener('click', async () => {
  for (const el of [...$items.children]) if (el._descargar) await el._descargar();
});

// iniciar con 1 + ejemplo de segundo vacío para demostrar
crearItem();
</script>
</body>
</html>
